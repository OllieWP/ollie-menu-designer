name: Create Release from Readme

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if this version needs a release
        id: version_check
        run: |
          VERSION=$(grep -oP 'Stable tag: \K.*' readme.txt | tr -d '[:space:]')
          echo "Version in readme.txt: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ -z "$VERSION" ]; then
            echo "No stable tag found in readme.txt. Skipping release."
            echo "needs_release=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null 2>&1; then
            echo "Tag v$VERSION already exists. Skipping release."
            echo "needs_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "No release for v$VERSION yet. Creating one."
            echo "needs_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.version_check.outputs.needs_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.version_check.outputs.needs_release == 'true'
        run: npm ci

      - name: Build plugin
        if: steps.version_check.outputs.needs_release == 'true'
        run: npm run build

      - name: Extract release notes from changelog
        if: steps.version_check.outputs.needs_release == 'true'
        id: changelog
        run: |
          VERSION="${{ steps.version_check.outputs.version }}"

          # Pull the changelog entry matching this version from readme.txt
          NOTES=$(awk -v ver="$VERSION" '
            $0 == "= " ver " =" { found = 1; next }
            found && /^=/ { exit }
            found { print }
          ' readme.txt)

          # Trim leading/trailing blank lines
          NOTES=$(printf '%s\n' "$NOTES" | sed -e '/[^[:space:]]/,$!d' | tac | sed -e '/[^[:space:]]/,$!d' | tac)

          if [ -z "$NOTES" ]; then
            NOTES="See readme.txt for details."
          fi

          echo "Release notes:"
          echo "$NOTES"

          {
            echo "notes<<NOTES_EOF"
            echo "$NOTES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create ZIP archive
        if: steps.version_check.outputs.needs_release == 'true'
        run: |
          # Create the zip file directly, excluding development files
          zip -r menu-designer.zip . \
              -x "*.git*" \
              -x "*.github*" \
              -x "node_modules/*" \
              -x "src/*" \
              -x "Sites/*" \
              -x "docs/*" \
              -x "zip/*" \
              -x "_playground/*" \
              -x "*.log" \
              -x "*.map" \
              -x ".DS_Store" \
              -x "*/.DS_Store" \
              -x "package.json" \
              -x "package-lock.json" \
              -x "*.sh" \
              -x "CLAUDE.md" \
              -x ".editorconfig" \
              -x ".gitignore" \
              -x ".gitattributes" \
              -x ".claude/*"

      - name: Create Release
        if: steps.version_check.outputs.needs_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version_check.outputs.version }}
          name: Menu Designer v${{ steps.version_check.outputs.version }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false
          files: menu-designer.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
